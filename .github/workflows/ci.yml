name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # daily at 06:00 UTC (~03:00 BRT) — keep the manifest fresh.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  manifest:
    name: Refresh manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.7
          bundler-cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wipe stale manifest
        run: |
          mkdir -p .selective_tests
          rm -f .selective_tests/run-*.ndjson

      - name: Run tests with TRACK_TEST_FILES=true
        env:
          TRACK_TEST_FILES: 'true'
        run: bundle exec rake test

      - name: Verify manifest was generated
        run: |
          set -e
          if ! ls .selective_tests/run-*.ndjson >/dev/null 2>&1; then
            echo "::error::No .selective_tests/run-*.ndjson file was generated"
            exit 1
          fi
          line_count=$(cat .selective_tests/run-*.ndjson | wc -l)
          echo "Manifest entries: $line_count"
          if [ "$line_count" -eq 0 ]; then
            echo "::error::Manifest is empty"
            exit 1
          fi

      - name: Verify CLI selects affected tests
        run: |
          set -e
          first_lib=$(ls lib/selective_tests/*.rb | head -1)
          echo "Asking CLI which tests touch $first_lib"
          bundle exec exe/selective-tests select "$first_lib"

      - name: Commit and push manifest
        run: |
          git add -f .selective_tests
          if git diff --cached --quiet; then
            echo "::notice::No manifest changes"
            exit 0
          fi
          git commit -m "chore: refresh selective_tests manifest [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && \
              git push origin main && exit 0
            echo "::warning::push attempt $attempt failed, retrying after backoff"
            sleep $(( attempt * 5 ))
          done
          echo "::error::Failed to push manifest after 4 attempts"
          exit 1
